# Publishes the plugin to WordPress.org when a GitHub release is published.
#
# The release tag must be the plugin version with no "v" prefix (for example 1.1.0).
# Run it manually from the Actions tab for a dry run: it builds everything and shows what would be
# committed to SVN, but commits nothing.
#
# Needs repository secrets SVN_USERNAME and SVN_PASSWORD (the WordPress.org SVN password from the
# committer's profile → Account & Security, not the account login password).
name: Deploy to WordPress.org

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Check that every version number matches
        id: version
        run: |
          node -e "
            const fs = require('fs');
            const versions = {
              'activecalculator-block.php Version': fs.readFileSync('activecalculator-block.php', 'utf8').match(/^\s*\*\s*Version:\s*(\S+)/m)[1],
              'readme.txt Stable tag': fs.readFileSync('readme.txt', 'utf8').match(/^Stable tag:\s*(\S+)/m)[1],
              'src/block.json version': require('./src/block.json').version,
              'package.json version': require('./package.json').version,
            };
            if ('${{ github.event_name }}' === 'release') versions['release tag'] = '${{ github.ref_name }}';
            console.table(versions);
            const unique = [...new Set(Object.values(versions))];
            if (unique.length !== 1) { console.error('Version numbers do not match.'); process.exit(1); }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + unique[0] + '\n');
          "

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          # Manual runs are always a dry run; only a published release commits to SVN.
          dry-run: ${{ github.event_name != 'release' }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: activecalculator
          VERSION: ${{ steps.version.outputs.version }}
          ASSETS_DIR: .wordpress-org
